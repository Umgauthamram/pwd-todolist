<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Crisp White Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#E4E4E7" stroke-width="8"/>

  <!-- Black Central Emblem / Badge -->
  <rect x="166" y="90" width="180" height="180" rx="44" fill="#000000"/>
  
  <!-- Stylized White Lettermark "B" -->
  <text x="256" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="130" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">B</text>

  <!-- "Beginning" Text in Solid Black -->
  <text x="256" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="-1">Beginning</text>

  <!-- Sleek Minimalist Subtitle -->
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#71717A" text-anchor="middle" letter-spacing="3">NOTES &amp; PRIVATE SPACE</text>
</svg>
