<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="8"/>

  <!-- Lightbulb (Google Keep style) -->
  <path d="M256 100 C190 100 140 150 140 216 C140 260 166 298 204 322 L204 360 C204 370 212 378 222 378 L290 378 C300 378 308 370 308 360 L308 322 C346 298 372 260 372 216 C372 150 322 100 256 100 Z" fill="url(#bulbGrad)"/>
  
  <!-- Base threads -->
  <rect x="220" y="390" width="72" height="14" rx="7" fill="#94A3B8"/>
  <rect x="232" y="414" width="48" height="12" rx="6" fill="#64748B"/>

  <!-- Shield Badge with Lock -->
  <circle cx="360" cy="360" r="76" fill="#0F172A" stroke="#F59E0B" stroke-width="8"/>
  <!-- Lock body -->
  <rect x="335" y="345" width="50" height="42" rx="8" fill="url(#lockGrad)"/>
  <!-- Lock shackle -->
  <path d="M344 345 L344 325 C344 314 351 306 360 306 C369 306 376 314 376 325 L376 345" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="360" cy="362" r="4" fill="#0F172A"/>
  <rect x="358" y="362" width="4" height="10" fill="#0F172A"/>
</svg>
